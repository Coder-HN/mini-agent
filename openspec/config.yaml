schema: spec-driven

context: |
  项目：min-agent。前台 FC Agent `min_agent`，产品定位见 documents/系统总体规划.md（ChatOps + go-admin RBAC）。
  运行时：Store（PostgreSQL）+ 内存 messages + Loop（FC while）+ Turn。
  业务数据经 go-admin 控制面 REST；Python 不直连业务库。
  M1：query 调 GET /api/v1/sys-user 与 /api/v1/sys-login-log，透传 context.access_token。
  M2：write 工具 create_user / disable_user；confirmed=false 只预览 impact，true 才 POST/PUT。
  M3：agent_tool_events 落库；GET /sessions/{id}/trail；Web 回放延后。
  R4：会话 owner_user_id；trail 按 viewer_user_id + data_scope（1=全部，否则仅本人）。
  本服务 :8001，控制面 :8000。联调主路径 /api/v1/agent/chat。
  延后：Web 会话回放、流式/权限两道门等。不含已下线的招商话术 / ai_crew。
  实现规格：openspec/；推进节奏：.cursor/rules/master-plan-rhythm.mdc。

rules:
  proposal:
    - 使用中文编写
    - 控制在约两页内
    - What Changes 或 Impact 中必须写清本 change 的 Non-goals
  design:
    - 使用中文编写
    - 优先使用 Store / Loop / Turn 用语
    - 写明延后的后续 change（kebab-case 名）
    - 区分：PostgreSQL=跨请求会话记忆；内存 messages=本轮 transcript
  specs:
    - 使用中文编写
    - 需求与场景对齐系统总体规划验收口径
  tasks:
    - 使用中文编写
    - 先规格后代码；含可独立验证步骤
